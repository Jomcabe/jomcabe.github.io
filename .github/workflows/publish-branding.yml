name: Publish approved personal branding
on:
  push:
    branches: [main]
    paths:
      - assets/favicon.svg
      - assets/social-card.svg
      - scripts/publish-branding.py
      - .github/workflows/publish-branding.yml
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: publish-personal-branding
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install SVG renderer
        run: python3 -m pip install CairoSVG==2.7.1
      - name: Render approved assets and update metadata
        run: python3 scripts/publish-branding.py
      - name: Commit generated images and metadata
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/social-card.png assets/favicon-32.png assets/apple-touch-icon.png index.html
          if ! git diff --cached --quiet; then
            git commit -m 'feat: publish J favicon and social sharing card'
            git push
          fi
      - name: Request Pages rebuild for generated commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST repos/${{ github.repository }}/pages/builds
